# Workflow profile (snakemake 7.x)
verbose: False
keep-going: True
rerun-incomplete: True
latency-wait: 30

use-conda: True
conda-frontend: mamba

# Per-rule resources. The gene aggregation reads every per-sample quant file into
# memory before writing, so it is the memory-heavy step on a full cohort.
set-resources:
  gene_h5ad:
    mem: "32GB"
    runtime: 240
  transcript_h5ad:
    mem: "32GB"
    runtime: 240
  gene_annotation:
    mem: "4GB"
    runtime: 30
